name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Runtime dependencies must stay free of high/critical advisories.
      - run: npm audit --omit=dev --audit-level=high
      # Dev tooling is reported but does not block: `braces` (via eslint-config-next)
      # has no patched release yet and is only used for linting our own source.
      - run: npm audit --audit-level=high
        continue-on-error: true
      - run: npm run lint -- --max-warnings=0
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
